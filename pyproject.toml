[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpa-agent"
version = "0.1.0"
description = "Causal FP&A agent — revenue variance, drivers, executive brief"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.6.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "python-dateutil>=2.9.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
]

[project.scripts]
fpa-agent = "fpa_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
