[project]
name = "fpa-explain-the-change"
version = "0.1.0"
description = "Explain the Change — deterministic FP&A variance engine + LLM narrator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "prismtrace-sdk>=0.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
supabase = ["supabase>=2.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
